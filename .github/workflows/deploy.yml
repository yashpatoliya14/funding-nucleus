name: Deploy to VM

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Validate deploy secrets
        run: |
          test -n "${{ secrets.VM_HOST }}" || (echo "VM_HOST is missing" && exit 1)
          test -n "${{ secrets.VM_USER }}" || (echo "VM_USER is missing" && exit 1)
          test -n "${{ secrets.VM_PORT }}" || (echo "VM_PORT is missing" && exit 1)
          test -n "${{ secrets.VM_SSH_KEY }}" || (echo "VM_SSH_KEY is missing" && exit 1)

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          port: ${{ secrets.VM_PORT }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            TARGET_DIR=""
            if [ -d "/root/funding-nucleus" ]; then
              TARGET_DIR="/root/funding-nucleus"
            elif [ -d "/root/funding_nucleus" ]; then
              TARGET_DIR="/root/funding_nucleus"
            elif [ -d "${HOME}/funding-nucleus" ]; then
              TARGET_DIR="${HOME}/funding-nucleus"
            elif [ -d "${HOME}/funding_nucleus" ]; then
              TARGET_DIR="${HOME}/funding_nucleus"
            fi

            if [ -n "$TARGET_DIR" ]; then
              cd "$TARGET_DIR"
              git pull origin master || git pull origin main || true
              if [ -f scripts/deploy-funding.sh ]; then
                chmod +x scripts/deploy-funding.sh
                ./scripts/deploy-funding.sh
              else
                npm install --legacy-peer-deps
                npm run build
                systemctl restart funding-bot || true
              fi
            elif [ -f ~/deploy-funding.sh ]; then
              chmod +x ~/deploy-funding.sh
              ~/deploy-funding.sh
            fi
